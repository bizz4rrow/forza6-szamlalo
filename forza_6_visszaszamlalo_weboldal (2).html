<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forza 6 Visszaszámláló</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      height: 100vh;
      background: url('forza-background.png') center center / cover no-repeat fixed;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      overflow: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(6px);
      z-index: 0;
    }

    .container {
      text-align: center;
      position: relative;
      z-index: 1;
      background: rgba(255,255,255,0.05);
      padding: 40px;
      border-radius: 25px;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 30px rgba(255,255,255,0.1);
      max-width: 900px;
      width: 90%;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 20px;
      color: #ff3c00;
      text-shadow: 0 0 15px rgba(255,60,0,0.7);
    }

    p {
      margin-bottom: 30px;
      color: #cccccc;
      font-size: 1.1rem;
    }

    .countdown {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .time-box {
      background: rgba(255,255,255,0.08);
      padding: 25px;
      border-radius: 20px;
      min-width: 130px;
      transition: transform 0.3s ease;
    }

    .time-box:hover {
      transform: scale(1.05);
    }

    .number {
      font-size: 3rem;
      font-weight: bold;
      color: #ff3c00;
    }

    .label {
      margin-top: 10px;
      font-size: 1rem;
      color: #ddd;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .footer {
      margin-top: 30px;
      font-size: 0.9rem;
      color: #888;
    }

    @media (max-width: 700px) {
      h1 {
        font-size: 2rem;
      }

      .number {
        font-size: 2rem;
      }

      .time-box {
        min-width: 100px;
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>FORZA 6 VISSZASZÁMLÁLÓ</h1>

    <p>
      Visszaszámlálás a Forza Horizon 6 megjelenéséig.
    </p>

    <div class="countdown">
      <div class="time-box">
        <div class="number" id="days">0</div>
        <div class="label">Nap</div>
      </div>

      <div class="time-box">
        <div class="number" id="hours">0</div>
        <div class="label">Óra</div>
      </div>

      <div class="time-box">
        <div class="number" id="minutes">0</div>
        <div class="label">Perc</div>
      </div>

      <div class="time-box">
        <div class="number" id="seconds">0</div>
        <div class="label">Másodperc</div>
      </div>
    </div>

    <div class="footer">
      Megjelenés: 2026. május 19. – 12:00 AM EDT
    </div>
  </div>

  <script>
    // Példa dátum (módosítható)
    const releaseDate = new Date("2026-05-19T00:00:00-04:00").getTime();

    const countdown = setInterval(() => {
      const now = new Date().getTime();
      const distance = releaseDate - now;

      if (distance < 0) {
        clearInterval(countdown);
        document.querySelector('.countdown').innerHTML = `
          <h2 style="color:#00ff88;">A FORZA 6 MEGJELENT!</h2>
        `;
        return;
      }

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      document.getElementById('days').textContent = days;
      document.getElementById('hours').textContent = hours;
      document.getElementById('minutes').textContent = minutes;
      document.getElementById('seconds').textContent = seconds;
    }, 1000);
  </script>
</body>
</html>
